# =============================================================================
# macros.cfg — all Filament Feeder macro logic (load/unload, tool routing,
# spool-assignment restore, nozzle cleaning). No hardware or per-printer
# tuning values live here — that's all in feeder.cfg's _FEEDER_VARS block.
# Merged from feeder_macros.cfg + toolmap.cfg + spool_sync.cfg + clean_nozzle.cfg
# — each section below keeps its own attribution comment where it already was.
# =============================================================================

# =============================================================================
# feeder_macros.cfg — load/unload macro logic (Bowden feeder)
# =============================================================================
# This file contains only macro logic — no MCU, pin, or hardware settings,
# and no per-printer tuning values. That all lives in feeder.cfg's
# [gcode_macro _FEEDER_VARS] block instead.
#
# Keeping this split means this file can be safely replaced/updated (e.g. via
# a future Moonraker update_manager entry) without ever touching your bucket
# position, temps, or other tuned settings in feeder.cfg.
#
# Requires feeder.cfg to be included too (MCU, steppers, and _FEEDER_VARS).
# =============================================================================


# -----------------------------------------------------------------------------
# Safety guard — called at the start of every load/unload macro
# Raises an error (halts execution) if any condition is not met
# -----------------------------------------------------------------------------

[gcode_macro _CHECK_READY]
description: Abort if machine is not homed, QGL not applied, or actively printing
gcode:
    {% if printer.toolhead.homed_axes != "xyz" %}
        { action_raise_error("Machine not homed.") }
    {% elif printer.quad_gantry_level.applied|lower == 'false' %}
        { action_raise_error("QGL not applied.") }
    {% elif printer.print_stats.state == "printing" and not printer.pause_resume.is_paused %}
        { action_raise_error("Print is active. Pause or cancel before loading/unloading.") }
    {% endif %}


# -----------------------------------------------------------------------------
# LOAD_ANY_TOOL — sensor-based load
# Positions toolhead at purge bucket then calls _FILAMENT_FEED. Heating and
# purging happen in _LOAD_COMPLETE once the toolhead sensor triggers.
#
# Parameters:
#   T = tool index
#   S = feeder speed in mm/s (default 30)
#   D = max feed distance / bowden length in mm (default 1400)
# -----------------------------------------------------------------------------

[gcode_macro LOAD_ANY_TOOL]
description: [T<index>] [S<speed>] [D<distance>] Load filament using sensor feedback
variable_paused: 0  # tracks pause state for _LOAD_COMPLETE
gcode:
    _CHECK_READY
    {% set fv = printer["gcode_macro _FEEDER_VARS"] %}
    {% set T = params.T|int %}
    {% set speed = params.S|default(30)|float %}
    {% set max_dist = params.D|default(1400)|float %}
    {% set paused = printer.pause_resume.is_paused %}

    {% if printer.toolchanger.tool_number|int != T %}
        RESPOND MSG="Switching to tool {T}"
        T{T}
    {% endif %}

    SET_GCODE_VARIABLE MACRO=LOAD_ANY_TOOL VARIABLE=paused VALUE={1 if paused else 0}

    G90
    {% if not paused %}
        {% if printer.toolhead.position.z < 20 %}
            G1 Z20 F900
        {% endif %}
        G1 X{fv.bucket_x} Y{fv.bucket_y} F1800
    {% else %}
        M118 Print is paused: skipping move to purge bucket
    {% endif %}

    M104 S{fv.load_temp}
    _FILAMENT_FEED T={T} S={speed} MAX={max_dist} D={fv.feed_step}


# -----------------------------------------------------------------------------
# _LOAD_COMPLETE — called by _FILAMENT_FEED_LOOP when sensor triggers
# Heats, purges, and cleans up. Reads context from _FEEDER_VARS / LOAD_ANY_TOOL.
# -----------------------------------------------------------------------------

[gcode_macro _LOAD_COMPLETE]
gcode:
    {% set fv = printer["gcode_macro _FEEDER_VARS"] %}
    {% set T = printer["gcode_macro _FILAMENT_FEED"].tool|int %}
    {% set paused = printer["gcode_macro LOAD_ANY_TOOL"].paused|int %}

    M109 S{fv.load_temp}
    M83
    G1 E{fv.load_purge} F300
    G1 E-5 F1800
    M82
    M400

    {% if not paused %}
        CLEAN_NOZZLE
        M104 S0
    {% endif %}

    M118 Tool {T} loaded


# -----------------------------------------------------------------------------
# _FILAMENT_FEED — entry point for sensor-based feeding
#
# Does a fast blind pre-feed (preload mm) to cover most of the bowden quickly,
# then hands off to _FILAMENT_FEED_LOOP which steps and checks the toolhead
# sensor each iteration.
#
# Parameters:
#   T       = tool index (default 0)
#   S       = feed speed in mm/s (default 30)
#   D       = step size for the sensor loop in mm (default 10)
#   MAX     = maximum total distance before aborting (default 1900)
#   PRELOAD = blind fast-feed distance before sensor loop starts (default 800)
# -----------------------------------------------------------------------------

[gcode_macro _FILAMENT_FEED]
variable_tool:      0
variable_speed:    30
variable_dist:     10
variable_max_dist: 1900
variable_preload:   800
variable_moved:     0
gcode:
    {% set T = params.T|default(0)|int %}
    {% set speed = params.S|default(speed)|float %}
    {% set dist = params.D|default(dist)|float %}
    {% set max_dist = params.MAX|default(max_dist)|float %}
    {% set preload = params.PRELOAD|default(preload)|float %}
    {% set sensor = "filament_switch_sensor filament_sensor_at_T%s" % T %}

    SET_GCODE_VARIABLE MACRO=_FILAMENT_FEED VARIABLE=tool VALUE={T}
    SET_GCODE_VARIABLE MACRO=_FILAMENT_FEED VARIABLE=speed VALUE={speed}
    SET_GCODE_VARIABLE MACRO=_FILAMENT_FEED VARIABLE=dist VALUE={dist}
    SET_GCODE_VARIABLE MACRO=_FILAMENT_FEED VARIABLE=max_dist VALUE={max_dist}
    SET_GCODE_VARIABLE MACRO=_FILAMENT_FEED VARIABLE=moved VALUE=0

    {% if printer[sensor].filament_detected %}
        RESPOND MSG="Tool {T}: Filament already at sensor — proceeding to heat and purge"
        _LOAD_COMPLETE
    {% else %}
        RESPOND MSG="Tool {T}: Starting filament feed"
        FORCE_MOVE STEPPER="extruder_stepper _tool{T}_feeder" DISTANCE={preload} VELOCITY={speed}
        SET_GCODE_VARIABLE MACRO=_FILAMENT_FEED VARIABLE=moved VALUE={preload}
        UPDATE_DELAYED_GCODE ID=_FILAMENT_FEED_LOOP DURATION=0.1
    {% endif %}


# -----------------------------------------------------------------------------
# _FILAMENT_FEED_LOOP — sensor-checking step loop (called via delayed_gcode)
#
# Reads state from _FILAMENT_FEED variables each iteration so sensor data is
# always fresh. Reschedules itself until sensor triggers or max distance hit.
# -----------------------------------------------------------------------------

[delayed_gcode _FILAMENT_FEED_LOOP]
gcode:
    {% set T = printer["gcode_macro _FILAMENT_FEED"].tool|int %}
    {% set speed = printer["gcode_macro _FILAMENT_FEED"].speed|float %}
    {% set dist = printer["gcode_macro _FILAMENT_FEED"].dist|float %}
    {% set max_dist = printer["gcode_macro _FILAMENT_FEED"].max_dist|float %}
    {% set moved = printer["gcode_macro _FILAMENT_FEED"].moved|float %}
    {% set sensor = "filament_switch_sensor filament_sensor_at_T%s" % T %}

    {% if printer[sensor].filament_detected %}
        RESPOND MSG="Tool {T}: Sensor triggered at {moved}mm"
        _LOAD_COMPLETE
    {% elif moved >= max_dist %}
        RESPOND MSG="Tool {T}: Max distance {max_dist}mm reached, aborting"
    {% else %}
        FORCE_MOVE STEPPER="extruder_stepper _tool{T}_feeder" DISTANCE={dist} VELOCITY={speed}
        SET_GCODE_VARIABLE MACRO=_FILAMENT_FEED VARIABLE=moved VALUE={moved + dist}
        UPDATE_DELAYED_GCODE ID=_FILAMENT_FEED_LOOP DURATION=0.1
    {% endif %}


# -----------------------------------------------------------------------------
# LOAD_ANY_TOOL_DIST — fixed-distance load (no sensor required)
# Use this for setups without a toolhead filament sensor.
# Measure your PTFE tube length carefully — filament will feed exactly D mm.
#
# Parameters:
#   T = tool index
#   S = feeder speed in mm/s (default 30)
#   D = distance to feed in mm (default 1400)
# -----------------------------------------------------------------------------

[gcode_macro LOAD_ANY_TOOL_DIST]
description: [T<index>] [S<speed>] [D<distance>] Load filament by fixed distance (no sensor)
gcode:
    _CHECK_READY
    {% set fv = printer["gcode_macro _FEEDER_VARS"] %}
    {% set T = params.T|int %}
    {% set speed = params.S|default(30)|float %}
    {% set dist = params.D|default(1400)|float %}
    {% set paused = printer.pause_resume.is_paused %}

    {% if printer.toolchanger.tool_number|int != T %}
        RESPOND MSG="Switching to tool {T}"
        T{T}
    {% endif %}

    M104 S{fv.load_temp}
    G90

    {% if not paused %}
        {% if printer.toolhead.position.z < 20 %}
            G1 Z20 F900
        {% endif %}
        G1 X{fv.bucket_x} Y{fv.bucket_y} F1800
    {% else %}
        M118 Print is paused: skipping move to purge bucket
    {% endif %}

    FORCE_MOVE STEPPER="extruder_stepper _tool{T}_feeder" DISTANCE={dist} VELOCITY={speed}

    M109 S{fv.load_temp}
    M83
    G1 E{fv.load_purge} F300
    G1 E-5 F1800
    M82
    M400

    {% if not paused %}
        CLEAN_NOZZLE
        M104 S0
    {% endif %}

    M118 Tool {T} loaded


# -----------------------------------------------------------------------------
# UNLOAD_ANY_TOOL — purges tip then retracts filament back past the feeder
#
# Parameters:
#   T = tool index
#   S = feeder retract speed in mm/s (default 30)
#   D = retract distance / bowden length in mm (default 1400)
# -----------------------------------------------------------------------------

[gcode_macro UNLOAD_ANY_TOOL]
description: [T<index>] [S<speed>] [D<distance>] Unload filament
# Tip-forming wiggle based on _SIFM_LOAD_FINISH by CapTightpants
# (https://github.com/CapTightpants/SIFM) — used with author's permission
gcode:
    _CHECK_READY
    {% set fv = printer["gcode_macro _FEEDER_VARS"] %}
    {% set T = params.T|int %}
    {% set speed = params.S|default(30)|float %}
    {% set dist = params.D|default(1400)|float %}

    {% if printer.toolchanger.tool_number|int != T %}
        RESPOND MSG="Switching to tool {T}"
        T{T}
    {% endif %}

    M104 S{fv.load_temp}
    G90
    {% if printer.toolhead.position.z < 20 %}
        G1 Z20 F900
    {% endif %}
    G1 X{fv.bucket_x} Y{fv.bucket_y} F1800

    M109 S{fv.load_temp}                                    ; wait for temp before moving filament
    M83
    G1 E1 F200                                              ; equalize pressure before retract
    G1 E-{fv.wiggle_init} F{fv.wiggle_speed}                ; initial pull to start tip formation
    {% for _ in range(fv.wiggle_passes) %}
        G1 E{fv.wiggle_dist} F{fv.wiggle_speed}             ; push
        G1 E-{fv.wiggle_dist} F{fv.wiggle_speed}            ; pull
    {% endfor %}
    G1 E-{fv.tip_slow_dist} F{fv.tip_slow_speed}            ; slow retract to form tip
    G1 E-{fv.tip_fast_dist} F{fv.tip_fast_speed}            ; fast retract to escape heatbreak before second blob forms
    G1 E-{fv.unload_purge} F600                             ; clear remaining filament from nozzle
    M82
    M400

    FORCE_MOVE STEPPER="extruder_stepper _tool{T}_feeder" DISTANCE=-{dist} VELOCITY={speed}  ; pull back through bowden

    M104 S0
    M118 Tool {T} unloaded


# -----------------------------------------------------------------------------
# RESET_ALL_TOOL_TEMPS — zero every tool's hotend target
#
# LOAD_ANY_TOOL / UNLOAD_ANY_TOOL only reset the target of the tool they just
# ran on. Call this from your PRINT_END and CANCEL_PRINT macros so a tool
# that was loaded/unloaded earlier in the print (or a print that got
# cancelled mid-load) doesn't leave a hotend target set — otherwise the
# toolchanger heats that tool before pickup on the next tool change.
# -----------------------------------------------------------------------------

[gcode_macro RESET_ALL_TOOL_TEMPS]
description: Set every tool's hotend target to 0
gcode:
    {% for n in printer.toolchanger.tool_numbers %}
        {% set ext = printer["tool T%d" % n].extruder %}
        SET_HEATER_TEMPERATURE HEATER={ext} TARGET=0
    {% endfor %}
    M118 All tool heaters reset


# =============================================================================
# toolmap.cfg — tool remapping / spool failover
# =============================================================================
# Tool router logic and macros provided by Nic335 (https://github.com/nic335)
# Original license: Unknown — used with explicit permission from the author
#
# Allows remapping any T<n> command to select a different physical tool at
# runtime, and automatically falling back to a backup tool if the requested
# one is out of filament or otherwise unavailable.
#
# Usage:
#   - T<n> macros call _TOOL_ROUTER TR=<n> instead of SELECT_TOOL T=<n>
#   - Filament sensors call SET_TOOL_FILAMENT_STATUS to report runout/insert
#   - Use SET_TOOLMAP to change mappings/backups at runtime
#   - Use SHOW_TOOLMAP to display current mappings in the console
#
# Default: identity mapping, all tools assumed to have filament until a
# sensor reports otherwise.
# =============================================================================


# Stores the current tool mapping as Python dicts with integer keys.
# map: requested tool number (int key) -> effective tool number (int value)
# backup_map: requested tool number (int key) -> backup tool number (int value)
# filament_status: tool number (int key) -> has filament (bool value)
[gcode_macro _TOOLMAP]
variable_map: {0: 0, 1: 1, 2: 2, 3: 3, 4: 4}
variable_backup_map: {}
variable_filament_status: {0: True, 1: True, 2: True, 3: True, 4: True}
gcode:


# Router macro - called by T<n> macros to resolve the effective tool.
# Selects the tool (SELECT_TOOL) and sets the active Spoolman spool
# (SET_ACTIVE_SPOOL) together, so whichever tool actually gets picked
# (mapped, backup, or literal) always has the matching spool set — no
# per-tool spool logic needed in the T<n> macros themselves. Requires each
# tool to have a corresponding [gcode_macro T<n>] with a variable_spool_id,
# as set up in exampleT0.cfg.
#
# SET_ACTIVE_SPOOL is only called if _FEEDER_VARS' spoolman_enabled is True
# (feeder.cfg) — set it False if you don't run Moonraker/Spoolman, since
# SET_ACTIVE_SPOOL would otherwise error with no Spoolman component loaded.
#
# Parameters:
#   TR: Tool Request - requested tool number (goes through mapping)
#   TL: Tool Literal - if set to -1 (default), bypasses mapping and selects the literal tool number
[gcode_macro _TOOL_ROUTER]
gcode:
    {% set tr = params.TR|default(0)|int %}
    {% set tl = params.TL|default(-1)|int %}
    {% set toolmap = printer["gcode_macro _TOOLMAP"] %}
    {% set map = toolmap.map %}
    {% set backup_map = toolmap.backup_map %}
    {% set filament_status = toolmap.filament_status %}
    {% set tool_numbers = printer.toolchanger.tool_numbers %}
    {% set spoolman_enabled = printer["gcode_macro _FEEDER_VARS"].spoolman_enabled %}

    # Literal mode - bypass all mapping
    {% if tl != -1 %}
        {% if tl in tool_numbers %}
            { action_respond_info("T%d LITERAL - selecting tool %d" % (tl, tl)) }
            SELECT_TOOL T={ tl }
            {% if spoolman_enabled %}
                SET_ACTIVE_SPOOL ID={printer["gcode_macro T%d" % tl].spool_id}
            {% endif %}
        {% else %}
            M117 T{ tl } LITERAL err: invalid
            { action_respond_info("T%d LITERAL error - tool does not exist. Pausing." % (tl,)) }
            PAUSE
        {% endif %}
    {% else %}
        # Determine target tool (mapped or identity)
        {% set target = map.get(tr, tr)|int %}
        {% set target_valid = target in tool_numbers %}
        {% set target_has_fil = filament_status.get(target, True) %}

        # Try target tool if valid and has filament
        {% if target_valid and target_has_fil %}
            SELECT_TOOL T={ target }
            {% if spoolman_enabled %}
                SET_ACTIVE_SPOOL ID={printer["gcode_macro T%d" % target].spool_id}
            {% endif %}

        # Try backup if target failed
        {% elif tr in backup_map %}
            {% set backup = backup_map[tr]|int %}
            {% set backup_valid = backup in tool_numbers %}
            {% set backup_has_fil = filament_status.get(backup, True) %}

            {% if backup_valid and backup_has_fil %}
                {% if not target_has_fil %}
                    { action_respond_info("T%d tool %d OUT OF FILAMENT, using backup T%d" % (tr, target, backup)) }
                {% else %}
                    { action_respond_info("T%d tool %d invalid, using backup T%d" % (tr, target, backup)) }
                {% endif %}
                SELECT_TOOL T={ backup }
                {% if spoolman_enabled %}
                    SET_ACTIVE_SPOOL ID={printer["gcode_macro T%d" % backup].spool_id}
                {% endif %}
            {% else %}
                M117 T{ tr } err: primary & backup failed
                { action_respond_info("T%d error - tool %d and backup %d both unavailable. Pausing." % (tr, target, backup)) }
                PAUSE
            {% endif %}

        # No backup available
        {% else %}
            M117 T{ tr } err: tool { target } unavailable
            {% if not target_valid %}
                { action_respond_info("T%d error - tool %d invalid, no backup. Pausing." % (tr, target)) }
            {% else %}
                { action_respond_info("T%d error - tool %d OUT OF FILAMENT, no backup. Pausing." % (tr, target)) }
            {% endif %}
            PAUSE
        {% endif %}
    {% endif %}


# Update tool mapping at runtime.
# Usage:
#   SET_TOOLMAP T=0 EFF=1           -> T0 will now select tool 1
#   SET_TOOLMAP T=0 EFF=1 BACKUP=2  -> T0 selects tool 1, backup is tool 2
#   SET_TOOLMAP T=0 EFF=0           -> reset T0 to identity
[gcode_macro SET_TOOLMAP]
gcode:
    {% set t = params.T|int %}
    {% set mapped_tool = params.EFF|int %}
    {% set toolmap = printer["gcode_macro _TOOLMAP"] %}
    {% set current_map = toolmap.map %}
    {% set current_backup = toolmap.backup_map %}
    {% set _ = current_map.update({t: mapped_tool}) %}
    SET_GCODE_VARIABLE MACRO=_TOOLMAP VARIABLE=map VALUE='{ current_map }'
    {% if params.BACKUP is defined %}
        {% set backup = params.BACKUP|int %}
        {% set _ = current_backup.update({t: backup}) %}
        SET_GCODE_VARIABLE MACRO=_TOOLMAP VARIABLE=backup_map VALUE='{ current_backup }'
        { action_respond_info("T%d -> tool %d (backup: tool %d)" % (t, mapped_tool, backup)) }
    {% else %}
        { action_respond_info("T%d -> tool %d" % (t, mapped_tool)) }
    {% endif %}


# Reset tool mapping and backups to identity (does NOT touch filament_status,
# which reflects real sensor state). A failover mid-print (map/backup_map
# changed via SET_TOOLMAP or the backup fallback in _TOOL_ROUTER) otherwise
# stays in effect for every print after it, since toolmap state only resets
# on a Klipper restart.
#
# Call this from your PRINT_END and CANCEL_PRINT macros (not part of this
# repo) so each print starts from a clean identity mapping.
[gcode_macro RESET_TOOLMAP]
description: Reset tool remapping/backups to identity
gcode:
    {% set identity = {} %}
    {% for n in printer.toolchanger.tool_numbers %}
        {% set _ = identity.update({n: n}) %}
    {% endfor %}
    SET_GCODE_VARIABLE MACRO=_TOOLMAP VARIABLE=map VALUE='{ identity }'
    SET_GCODE_VARIABLE MACRO=_TOOLMAP VARIABLE=backup_map VALUE='{ {} }'
    { action_respond_info("Tool map reset to identity") }


# Update filament status for a specific tool.
# Called by feeder-side filament sensors to indicate filament presence.
# Usage:
#   SET_TOOL_FILAMENT_STATUS T=0 HAS_FILAMENT=1  -> Tool 0 has filament
#   SET_TOOL_FILAMENT_STATUS T=1 HAS_FILAMENT=0  -> Tool 1 is out of filament
[gcode_macro SET_TOOL_FILAMENT_STATUS]
gcode:
    {% set tool = params.T|int %}
    {% set has_filament = (params.HAS_FILAMENT|int != 0) %}
    {% set toolmap = printer["gcode_macro _TOOLMAP"] %}
    {% set current_status = toolmap.filament_status %}
    {% set _ = current_status.update({tool: has_filament}) %}
    SET_GCODE_VARIABLE MACRO=_TOOLMAP VARIABLE=filament_status VALUE='{ current_status }'
    {% if has_filament %}
        { action_respond_info("Tool %d filament status: AVAILABLE" % (tool,)) }
    {% else %}
        { action_respond_info("Tool %d filament status: OUT/EMPTY" % (tool,)) }
    {% endif %}


# Display current tool mapping and backup mapping in the console.
# Shows: Tool | Filament | Maps To | Backup
[gcode_macro SHOW_TOOLMAP]
gcode:
    {% set toolmap = printer["gcode_macro _TOOLMAP"] %}
    {% set map = toolmap.map %}
    {% set backup_map = toolmap.backup_map %}
    {% set filament_status = toolmap.filament_status %}
    {% set tool_numbers = printer.toolchanger.tool_numbers %}
    { action_respond_info("=== Tool Status & Mapping ===") }
    { action_respond_info("Tool | Filament | Maps To | Backup") }
    { action_respond_info("-----|----------|---------|-------") }
    {% for tool in tool_numbers %}
        {% set has_fil = filament_status.get(tool, True) %}
        {% set fil_text = "OK " if has_fil else "OUT" %}

        # Show what this T command maps to
        {% set target = map.get(tool, tool) %}
        {% set maps_to = ("T%d" % target) if target != tool else "self" %}

        {% set backup_tool = "none" %}
        {% if tool in backup_map %}
            {% set backup_tool = "T%d" % backup_map[tool] %}
        {% endif %}
        { action_respond_info(" T%-3d | %-8s | %-7s | %s" % (tool, fil_text, maps_to, backup_tool)) }
    {% endfor %}
    { action_respond_info("============================") }


# =============================================================================
# spool_sync.cfg — Tool Feeder integration glue
# =============================================================================
# This file is original Tool Feeder code, not part of any credited upstream
# component (see toolmap.cfg for Nic335's attribution and feeder_macros.cfg
# for the rest of the load/unload macros).
#
# Klipper's [gcode_macro T<n>] variable_spool_id resets to its declared
# default (None) on every restart — gcode_macro variables live in RAM only.
# save_variables does not reset, and is already the field both KlipperScreen's
# "Assign" action and spoolman_lane_sync.py's primary sync path read/write
# (as t{n}__spool_id). Without this file, toolmap.cfg's _TOOL_ROUTER would
# see spool_id=None after every Klipper restart until the user re-opened
# KlipperScreen and re-assigned each tool's spool by hand.
#
# This macro closes that gap: on startup, it re-hydrates each tool's in-RAM
# spool_id from the persisted save_variables value, so _TOOL_ROUTER's
# SET_ACTIVE_SPOOL calls stay correct across restarts.
# =============================================================================

[delayed_gcode _RESTORE_SPOOL_ASSIGNMENTS]
initial_duration: 1
gcode:
    {% set sv = printer.save_variables.variables %}
    {% for n in printer.toolchanger.tool_numbers %}
        {% set key = "t%d__spool_id" % n %}
        {% if key in sv %}
            SET_GCODE_VARIABLE MACRO=T{n} VARIABLE=spool_id VALUE={sv[key]}
        {% endif %}
    {% endfor %}


# =============================================================================
# clean_nozzle.cfg — Purge bucket nozzle wipe macro
# =============================================================================
# Tune the variables below to match your purge bucket and brush position.
# The macro heats to min_temp if the nozzle is cold, wipes, then restores
# the original target temperature.
# =============================================================================

[gcode_macro CLEAN_NOZZLE]
variable_start_x: 30          # X position of the left edge of the brush
variable_start_y: -1          # Y position of the brush
variable_start_z: 0.7         # Z height to wipe at
variable_wipe_dist: 32        # Length of the brush in mm
variable_wipe_times: 8        # Number of wipe passes
variable_wipe_speed: 200      # Wipe speed in mm/s
variable_raise_distance: 25   # Z raise distance after wiping
variable_min_temp: 150        # Minimum temp to wipe at (heats up if below this)
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    RESPOND TYPE=echo MSG="Cleaning nozzle"
    {% set heater = printer.toolhead.extruder %}
    {% set target_temp = printer[heater].target %}
    {% if target_temp < min_temp %}
        M104 S{min_temp}
    {% endif %}
    G90
    G1 X{start_x + (wipe_dist/2)} Y{start_y} F12000
    TEMPERATURE_WAIT SENSOR={heater} MINIMUM={min_temp}
    G1 Z{start_z} F1500
    G1 X{start_x} F{wipe_speed * 60}
    {% for wipes in range(1, (wipe_times + 1)) %}
        G1 X{start_x + wipe_dist} F{wipe_speed * 60}
        G1 X{start_x} F{wipe_speed * 60}
    {% endfor %}
    G1 Y0 X60
    G1 Y4 X60
    G1 Z{raise_distance}
    M104 S{target_temp}
