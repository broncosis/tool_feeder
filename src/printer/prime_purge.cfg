# prime_purge.cfg
# Per-tool prime/purge sequence run at print start: primes every tool that
# will be used in the print (passed as T0_TEMP, T1_TEMP, ... params), keeping
# the initial print tool hot last so it's ready to print immediately.
#
# Based on work by N3MI-DG (no public repo/link - shared directly)
# Original license: Unknown - used with explicit permission from the author
# Heavily modified since - only loosely based on the original at this point.
#
# Install: [include prime_purge.cfg], call from your slicer's start gcode
# (or your own print-start macro) as e.g.:
#   PRIME_PURGE INITIAL_TOOL={initial_tool} T0_TEMP=210 T1_TEMP=0 ...
#
# Requires: klipper-toolchanger (printer.toolchanger, SELECT_TOOL - not part
# of Tool Feeder), CLEAN_NOZZLE and the T<n> macros / SET_FILAMENT_SENSOR
# encoder_sensor_T<n> objects from this repo's tool_feeder_macros.cfg /
# tool.cfg.template.

[gcode_macro PRIME_PURGE]
description: Prime all extruders before printing.
  INITIAL_TOOL= Tool number, optional.
variable_purge_volume:         40      # Amount to purge
variable_initial_tool_retract: 0.5    # Retraction distance for the initial tool (if defined) after prime
variable_docked_tool_retract:  5      # Retraction distance for docked tools after prime
variable_z_move_pos:           5      # Distance from bed on Z axis while moving
variable_move_speed:           10000  # Travel move speed
variable_prime_speed:          200    # Prime speed
variable_temp_drop:            50     # 90Amount of temperature drop applied to nozzles that are being docked
variable_purge_x:              5     # X purge location
variable_purge_y:              0   # y Pruge location
variable_retract_speed:        1000   # retract speed
gcode:
  SAVE_GCODE_STATE NAME=PRIME_PURGE_STATE

  # Disable encoder sensors during purge to prevent false runouts
  {% for tn in printer.toolchanger.tool_numbers %}
    SET_FILAMENT_SENSOR SENSOR=encoder_sensor_T{tn} ENABLE=0
  {% endfor %}

  # Build active tool list from passed T0_TEMP, T1_TEMP etc params
  {% set print_tools = [] %}
  {% for tn in printer.toolchanger.tool_numbers %}
    {% set tooltemp_param = 'T' ~ tn|string ~ '_TEMP' %}
    {% if tooltemp_param in params and params[tooltemp_param]|int > 0 %}
      {% set _ = print_tools.append(tn) %}
    {% endif %}
  {% endfor %}

  # Re-order: initial_tool purged last so it stays hot for printing
  {% if params.INITIAL_TOOL is defined %}
    {% set initial_tool = params.INITIAL_TOOL|int %}

    {% if print_tools|length > 1 %}
      {% set snorlax = print_tools.pop(print_tools.index(initial_tool)) %}
      {% set _ = print_tools.append(initial_tool) %}
    {% endif %}

    {% if printer.toolchanger.tool_number != initial_tool
        and printer.toolchanger.tool_number != print_tools[0]
        and printer.toolchanger.tool_number in print_tools %}
      {% set mimikyu  = print_tools.pop(print_tools.index(printer.toolchanger.tool_number)) %}
      {% set bulbasaur = print_tools.insert(0, printer.toolchanger.tool_number) %}
    {% endif %}

  {% else %}
    {% set initial_tool = None %}
  {% endif %}

  {% for tn in print_tools %}
    T{tn}
    # No explicit T=/HEATER= targeting below - M104/M109 with no T parameter
    # always heat whatever extruder is *currently active* (confirmed in
    # Klipper's own kinematics/extruder.py cmd_M104: an explicit T= does a
    # literal "extruder"/"extruderN" lookup with no toolchanger awareness,
    # but omitting T= uses toolhead.get_extruder(), i.e. whatever T{tn} just
    # made active). That's correct regardless of whether T{tn} was remapped
    # by SET_TOOLMAP, redirected to a backup tool, or ran as a plain
    # identity selection - no need to track/recompute which physical tool
    # ended up active.
    {% set tooltemp_param = 'T' ~ tn|string ~ '_TEMP' %}
    {% set heat_temp = params[tooltemp_param]|int %}

    G0 X{purge_x} Y{purge_y} Z{z_move_pos} F{move_speed}

    M109 S{heat_temp}

    RESPOND TYPE=echo MSG="Priming T{tn} ({printer.toolhead.extruder}) at {heat_temp}C"
    M83
    G92 E0
    G91
    G1 E{purge_volume} F{prime_speed}
    G1 E-{initial_tool_retract if tn == initial_tool else docked_tool_retract} F{retract_speed}
    G4 P2000
    CLEAN_NOZZLE

    {% if initial_tool is not none and initial_tool in print_tools and tn != initial_tool %}
      M104 S{heat_temp - temp_drop}
    {% endif %}

    G90
  {% endfor %}

  # Re-enable encoder sensors after purge
  {% for tn in printer.toolchanger.tool_numbers %}
    SET_FILAMENT_SENSOR SENSOR=encoder_sensor_T{tn} ENABLE=1
  {% endfor %}

  RESTORE_GCODE_STATE NAME=PRIME_PURGE_STATE
