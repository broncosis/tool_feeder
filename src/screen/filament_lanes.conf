# Add this block to your ~/printer_data/config/KlipperScreen.conf
# It places a "Filament Lanes" button in the top-level main menu.

[menu __main filament_lanes]
name: Filament
icon: filament
panel: filament_lanes

# Optional: show a Load button on each lane (default: hidden).
#show_load_buttons: true

# Optional: configure the bottom action bar buttons.
# Format: MACRO_NAME:Label:icon:style
# icon and style are optional.  style options: color1, color2, color3, color4
# If omitted, defaults to Clean Nozzle and Unselect Tool.
#action_button_1: CLEAN_NOZZLE:Clean Nozzle:clean:color1
#action_button_2: UNSELECT_TOOL:Unselect Tool:toolchanger:color2
#action_button_3: MY_MACRO:My Button::color3

# KlipperScreen has two separate menu trees: __main (idle screen) and
# __print (the printing-status page) — the __main entry above is NOT
# reachable once a print starts (KlipperScreen replaces the whole idle menu
# with the print-status screen and its own __print menu; this is stock
# KlipperScreen behavior, not something Tool Feeder can bypass). This
# second entry adds the same Filament Lanes panel to __print too, so
# SET_TOOLMAP/failover remapping and spool assignment stay reachable
# mid-print — mirrors how KlipperScreen's own built-in Spoolman panel is
# already reachable during printing via the stock [menu __print spoolman].
[menu __print filament_lanes]
name: Filament
icon: filament
panel: filament_lanes
